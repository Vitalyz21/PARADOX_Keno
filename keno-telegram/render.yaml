services:
  - type: web
    name: keno-telegram
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: keno-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/keno.sqlite
      - key: 9223135268:AAESd5ErO5z-xcYLPjOAvycsW3LNwRRTIwg
        sync: false
