services:
  - type: web
    name: paradox-keno
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DB_PATH
        value: /tmp/paradox-keno.db
