<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031514">
  <title>PARADOX KENO — Training Place</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">PK</div>
      <div class="brand-name">
        <div>PARADOX <span>KENO</span></div>
        <small>KENO KILLERS TRAINING PLACE</small>
      </div>
    </div>

    <div class="top-right">
      <div class="balance-card">
        <div class="coin">USDP</div>
        <div>
          <small>БАЛАНС</small>
          <strong id="balance">50.00</strong>
        </div>
      </div>

      <div class="audio-control">
        <button id="sfxToggle" class="audio-button">
          <span>🔊</span>
          <small>ЗВУКИ</small>
          <b id="sfxState">ВКЛ</b>
        </button>
        <input id="sfxVolume" type="range" min="0" max="100" value="70">
        <small>SFX <span id="sfxValue">70</span>%</small>
      </div>

      <div class="audio-control">
        <button id="musicToggle" class="audio-button">
          <span>♫</span>
          <small>МУЗЫКА</small>
          <b id="musicState">ВЫКЛ</b>
        </button>
        <input id="musicVolume" type="range" min="0" max="100" value="60">
        <small>MUSIC <span id="musicValue">60</span>%</small>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="game-panel">
      <div class="game-heading">
        <span>УРОВЕНЬ СЛОЖНОСТИ</span>
        <div>ВЫБРАНО: <b id="selectedCount">0</b> / 10</div>
      </div>

      <div class="difficulty" id="difficulty">
        <button class="active" data-level="easy">ЛЕГКИЙ</button>
        <button data-level="medium">СРЕДНИЙ</button>
        <button data-level="hard">ВЫСОКИЙ</button>
        <button data-level="expert">ЭКСПЕРТ</button>
      </div>

      <div class="number-grid" id="numberGrid"></div>

      <div class="draw-status" id="drawStatus">
        Выбери от 1 до 10 чисел
      </div>
    </section>

    <aside class="side-panel">
      <button class="history-title" id="historyToggle">
        <span>◴</span>
        ИСТОРИЯ РАУНДОВ
        <b>›</b>
      </button>

      <div class="history-box" id="historyBox">
        <div class="stat-row"><span>РАУНД:</span><b id="roundNumber">—</b></div>
        <div class="stat-row"><span>ВЫИГРЫШ:</span><b class="gold" id="lastWin">0.00</b></div>
        <div class="stat-row"><span>СОВПАДЕНИЙ:</span><b id="lastHits">0 / 10</b></div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="risk-box">
        <h3>РИСК</h3>
        <div class="risk-options" id="riskOptions">
          <button data-risk="0.5">НИЗКИЙ<strong>x0.5</strong></button>
          <button class="active" data-risk="1">СРЕДНИЙ<strong>x1.0</strong></button>
          <button data-risk="1.5">ВЫСОКИЙ<strong>x1.5</strong></button>
          <button data-risk="2">МАКСИМУМ<strong>x2.0</strong></button>
        </div>
      </div>

      <div class="payout-box">
        <h3>ТАБЛИЦА ВЫИГРЫШЕЙ</h3>
        <div id="payoutTable"></div>
        <small class="payout-note">Учебные коэффициенты виртуальной игры</small>
      </div>
    </aside>
  </main>

  <footer class="bottom-controls">
    <button id="playButton" class="play-button">
      <span>▶</span> ИГРАТЬ
    </button>

    <div class="bet-box">
      <div class="bet-title">СТАВКА</div>
      <div class="bet-adjust">
        <button id="minusBet">−</button>
        <input id="betAmount" type="number" min="0.01" step="0.01" value="1.00">
        <button id="plusBet">+</button>
      </div>
      <small>Баланс: <span id="betBalance">50.00</span></small>
    </div>

    <button class="bet-action" id="halfBet">
      <strong>½</strong>
      <span>УМЕНЬШИТЬ<br>В 2 РАЗА</span>
    </button>

    <button class="bet-action" id="doubleBet">
      <strong>×2</strong>
      <span>УДВОИТЬ<br>СТАВКУ</span>
    </button>

    <button class="bet-action max-action" id="maxBet">
      <strong>MAX</strong>
      <span>МАКС<br>СТАВКА</span>
    </button>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
